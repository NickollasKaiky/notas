<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
</head>
<body>

    <div class="container">
        <h1>Minhas notas</h1>

        <!-- Entrada -->
         <div class="entrada">
            <input type="text" id="nota" placeholder="digite uma nota ...">
            <button id="btnAdicionar">adicionar</button>
         </div>

        <!-- Notas -->
        <ul id="listaNotas"></ul>


    </div>

    <script>
        // HTLM

        const listaNotas = document.querySelector('#listaNotas');

        const campoNota = document.querySelector('#nota');

        const btnAdicionar = document.querySelector('#btnAdicionar');

        let notas = JSON.parse(
            localStorage.getItem('notas')
        );

        if(notas == null){
            notas = [];
        }

        // ADICIONAR

        function adicionarNota(){
            const texto = campoNota.value.trim();

            if(texto == ''){
                alert('Digite algo!')
                return;
            }

            const novaNota = {
                texto : texto,
                concluida : false
            }

            notas.push(novaNota);

            localStorage.setItem(
                'notas',
                JSON.stringify(notas)
            )

            campoNota.value = '';
            exibirNotas();
        }

        // EXIBIR

        function exibirNotas(){
            listaNotas.innerHTML = '';

            if (notas.length == 0) {
                listaNotas.textContent = 'Nenhuma Nota Cadastrada';
                return;
            }

            notas.forEach(function(nota, indice){
                const item = document.createElement('li');

                // texto

                const texto = document.createElement('span');

                texto.textContent = nota.texto;

                texto.classList.add('texto-nota')

                if(nota.concluida){
                    text.classList.add('concluida')
                }

                // btn remover

                const btnRemover = document.createElement('button');
                btnRemover.textContent = 'Remover';

                btnRemover.addEventListener('click', function(){
                    removerNota(indice);
                })

                item.appendChild(texto);
                item.appendChild(btnRemover);
                listaNotas.appendChild(item);
            })

            // btn APAGAR TUDO

            const btnApagarTudo = document.createElement('button')
            btnApagarTudo.textContent = 'Apagar Tudo'
            btnApagarTudo.addEventListener('click', apagarTudo)
            listaNotas.appendChild(btnApagarTudo)

        }

        // REMOVER
        function removerNota(indice){
            notas.splice(indice, 1);

            localStorage.setItem(
                'notas',
                JSON.stringify(notas)
            )

        exibirNotas();
        }

        // Apagar Tudo
        function apagarTudo() {
            notas = [];
            localStorage.setItem(
                'notas',
                JSON.stringify(notas)
            )
        exibirNotas();
            
        }

        // EVENTOS
        btnAdicionar.addEventListener('click', adicionarNota);
        

    </script>
    
</body>
</html>
